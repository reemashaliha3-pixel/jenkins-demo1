name: Java CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B clean compile

      - name: Test
        run: mvn -B test

      - name: Package
        run: mvn -B package -DskipTests

      - name: Save the jar file
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-demo-jar
          path: target/*.jar
